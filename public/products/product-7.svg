<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Water Bottle">
  <defs>
    <linearGradient id="bottleBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#effcf7"/>
      <stop offset="100%" stop-color="#defae8"/>
    </linearGradient>
  </defs>
  <style>
    .bottle { animation: bob 3.2s ease-in-out infinite; }
    .cap { animation: pulse 2.2s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-9px); } }
    @keyframes pulse { 0%,100% { opacity: 0.8; } 50% { opacity: 1; } }
  </style>
  <rect width="200" height="200" rx="24" fill="url(#bottleBg)"/>
  <g class="bottle">
    <rect x="82" y="38" width="36" height="22" rx="7" fill="#3ecf8e" class="cap"/>
    <rect x="72" y="56" width="56" height="90" rx="18" fill="#4ade80"/>
    <path d="M84 78 H116" stroke="#dcfce7" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 98 H116" stroke="#dcfce7" stroke-width="6" stroke-linecap="round"/>
    <path d="M84 118 H112" stroke="#dcfce7" stroke-width="6" stroke-linecap="round"/>
    <path d="M94 138 Q100 146 106 138" fill="none" stroke="#dcfce7" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
