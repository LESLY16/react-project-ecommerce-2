<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Classic Shirt">
  <defs>
    <linearGradient id="shirtBg" x1="0" x2="1">
      <stop offset="0%" stop-color="#f0f7ff"/>
      <stop offset="100%" stop-color="#dfefff"/>
    </linearGradient>
  </defs>
  <style>
    .bg { animation: floaty 4s ease-in-out infinite; }
    .shirt { animation: bob 3s ease-in-out infinite; transform-origin: center; }
    .accent { animation: pulse 2.6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-8px); } }
    @keyframes floaty { 0%,100% { transform: translateY(0px); } 50% { transform: translateY(-5px); } }
    @keyframes pulse { 0%,100% { opacity: 0.9; } 50% { opacity: 1; } }
  </style>
  <rect width="200" height="200" rx="24" fill="url(#shirtBg)"/>
  <g class="bg">
    <circle cx="150" cy="48" r="22" fill="#cfe7ff" opacity="0.8"/>
    <circle cx="52" cy="148" r="18" fill="#d7ebff" opacity="0.7"/>
  </g>
  <g class="shirt">
    <path d="M70 52 L92 38 L108 38 L130 52 L146 72 L130 82 L134 150 Q100 170 66 150 L70 82 L54 72 Z" fill="#4b8df8"/>
    <path d="M88 52 L100 70 L112 52" fill="none" stroke="#dfeeff" stroke-width="6" stroke-linecap="round"/>
    <path d="M82 80 L100 100 L118 80" fill="none" stroke="#dfeeff" stroke-width="6" stroke-linecap="round"/>
    <path d="M68 92 Q100 112 132 92" fill="none" stroke="#dfeeff" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
    <circle cx="100" cy="138" r="8" fill="#dfeeff" class="accent"/>
  </g>
</svg>
